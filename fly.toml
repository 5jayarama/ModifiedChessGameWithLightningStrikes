# fly.toml app configuration file generated for thunderchess on 2026-10-04T01:33:55Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'thunderchess'
primary_region = 'sjc'

[build]

[env]
  CHESS_DB_PATH = '/data/chess.db'
  TRUST_PROXY_HOPS = '1'

[[mounts]]
  source = 'chess_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
